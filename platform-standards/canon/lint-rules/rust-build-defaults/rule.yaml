schema_version: 1
id: rust-build-defaults
name: Rust build defaults
description: >-
  Audits the auto-discovered `.cargo/config.toml` and the pinned toolchain
  against the estate build standard: the parallel `rustc` frontend and the
  mold linker as defaults (RT-017, RT-008), shared frontend flags retained
  across `rustflags` replacements while target backends stay scoped (RT-018),
  and the Cranelift
  codegen backend either configured for the development profile or refused
  by a recorded, current exception (RT-009). It also audits the builds that
  replace those defaults: every coverage path and dev-profile release build
  selects LLVM where Cranelift is the default (RT-019), and every Makefile
  repository-toolchain gate recipe (RT-020) and direct cargo workflow step
  (RT-021) that assigns
  `RUSTFLAGS` restates the fast flags. Direct installer-managed Whitaker
  routes instead require statically known isolation and reject development
  flag contamination; unresolved profile or ambient routes remain unmeasured.
  A route that runs after a `cd` out of the checkout never reads the checkout's
  Cargo configuration. A repository whose fast route is explicit and kept out
  of that configuration on purpose records the exception as data in
  `.concordat`; the exception waives clauses only while its route still carries
  the standard's flags and its decision record exists (BD-010).
  Audit-only: this rule declares no mutations.
version: 0.3.0
sensor:
  type: conftest
  input: policy-input/rust-build-defaults
  policy: policy/
  tests:
    - policy/
  data:
    - fixtures/data.json
parameters:
  schema:
    type: object
    additionalProperties: false
    properties:
      threads_flag:
        type: string
        description: The parallel-frontend flag every rustflags source must carry.
      linker_flag:
        type: string
        description: The linker flag the platform-specific source must add.
      linker_platforms:
        type: array
        items:
          type: string
        description: >-
          Platforms the linker flag is required on. An empty list makes the
          linker clause inapplicable, for a repository that does not build
          for any platform the linker ships on.
      codegen_backend:
        type: string
        description: The codegen backend the development profile should select.
      exception_documents:
        type: array
        items:
          type: string
        description: Documents scanned for a recorded codegen-backend exception.
      exception_keyword:
        type: string
        description: The word an exception section's heading must contain.
      gate_targets:
        type: array
        items:
          type: string
        description: >-
          Make targets whose static closure BD-008 reads for RUSTFLAGS
          assignments.
      gate_cargo_subcommands:
        type: array
        items:
          type: string
        description: >-
          Cargo subcommands a workflow step runs as a gate build, which BD-009
          holds to the fast flags when the step's RUSTFLAGS is set.
      waivable_clauses:
        type: array
        items:
          type: string
        description: >-
          Clauses a recorded exception in `.concordat` can waive: the ones that
          ask for the fast flags and the backend to be defaults.
      setup_rust_rustflags:
        type: string
        description: >-
          The RUSTFLAGS value shared-actions setup-rust exports when its
          `rustflags` input is not set (its default at 4fb8eb7a).
  defaults:
    threads_flag: -Zthreads=8
    linker_flag: -Clink-arg=-fuse-ld=mold
    linker_platforms:
      - linux
    codegen_backend: cranelift
    exception_documents:
      - docs/developers-guide.md
    exception_keyword: Cranelift
    gate_targets:
      - lint
      - test
      - typecheck
      - build
    gate_cargo_subcommands:
      - build
      - check
      - clippy
      - doc
      - nextest
      - test
    waivable_clauses:
      - BD-001
      - BD-002
      - BD-004
      - BD-008
      - BD-009
    setup_rust_rustflags: -D warnings
