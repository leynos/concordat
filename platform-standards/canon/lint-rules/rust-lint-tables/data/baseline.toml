# The estate's Rust lint baseline: the tables every governed Cargo package
# ends with. Copy the `[workspace.lints.*]` tables below into a workspace root
# and add `[lints] workspace = true` to every member, the root package
# included. A package outside any workspace (a PyO3 extension in
# `rust_extension/`, say) copies the same tables as package-level `[lints.*]`.
#
# This file is the single source. `baseline.json` is generated from it by
# `generate.py`, and the `rust-lint-tables` rule and the root lint policy both
# read that JSON. Change an entry here, regenerate, run the estate survey, and
# say what it showed in the pull request (see the rule's README).
#
# A repository may be stricter than a level here. It may be weaker only
# through the rule's `exemptions` parameter or the canon's `pyo3_divergences`
# (see `extras.toml`), each with a reason and a review trigger.

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# 1. hygiene
allow_attributes                    = "deny"
allow_attributes_without_reason     = "deny"
blanket_clippy_restriction_lints    = "deny"
# Omit this entry only where Whitaker's `macro_aware_cognitive_complexity`
# gates the whole workspace (see `extras.toml`); otherwise `clippy.toml` also
# sets `cognitive-complexity-threshold = 9`.
cognitive_complexity                = "deny"
disallowed_methods                  = "deny"
needless_pass_by_value              = "deny"
implicit_hasher                     = "deny"
missing_assert_message              = "deny"

# 2. debugging leftovers
dbg_macro                           = "deny"
print_stdout                        = "deny"
print_stderr                        = "deny"

# 3. panic-prone operations
unwrap_used                         = "deny"
expect_used                         = "deny"
indexing_slicing                    = "deny"
string_slice                        = "deny"
integer_division                    = "deny"
integer_division_remainder_used     = "deny"
panic_in_result_fn                  = "deny"
unreachable                         = "deny"

# 4. portability
host_endian_bytes                   = "deny"
little_endian_bytes                 = "deny"
big_endian_bytes                    = "deny"

# 5. nursery idiom polish
let_underscore_must_use             = "deny"
or_fun_call                         = "deny"
option_if_let_else                  = "deny"
self_named_module_files             = "deny"
shadow_reuse                        = "deny"
shadow_same                         = "deny"
shadow_unrelated                    = "deny"
str_to_string                       = "deny"
string_lit_as_bytes                 = "deny"
try_err                             = "deny"
unneeded_field_pattern              = "deny"
use_self                            = "deny"

# 6. numerical foot-guns
float_arithmetic                    = "deny"
cast_possible_truncation            = "deny"
cast_possible_wrap                  = "deny"
cast_precision_loss                 = "deny"
lossy_float_literal                 = "deny"

# 7. API ergonomics
missing_const_for_fn                = "deny"
must_use_candidate                  = "deny"
unused_async                        = "deny"
missing_docs_in_private_items       = "deny"

# 8. error handling
missing_panics_doc                  = "deny"
error_impl_error                    = "deny"
result_large_err                    = "deny"

[workspace.lints.rust]
unknown_lints                       = "deny"
renamed_and_removed_lints           = "deny"
# `forbid` everywhere. A boundary crate that genuinely needs `unsafe` sets
# `deny` and is named in the rule's `boundary_crates` parameter with its ADR
# and a Miri command the gate reaches.
unsafe_code                         = "forbid"
missing_docs                        = "deny"
# The level is what the rule checks. `check-cfg` is the repository's own list:
# add every cfg it uses (`loom`, `coverage`, `docsrs`, `kani`).
unexpected_cfgs                     = { level = "warn", check-cfg = ["cfg(dylint_lib, values(any()))"] }

[workspace.lints.rustdoc]
missing_crate_level_docs            = "deny"
broken_intra_doc_links              = "deny"
private_intra_doc_links             = "deny"
bare_urls                           = "deny"
invalid_html_tags                   = "deny"
invalid_codeblock_attributes        = "deny"
unescaped_backticks                 = "deny"
