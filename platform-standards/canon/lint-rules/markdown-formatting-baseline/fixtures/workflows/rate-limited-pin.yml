---
name: CI

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@fedcba9876543210fedcba9876543210fedcba98  # answered as rate limited
        with:
          globs: '**/*.md'
