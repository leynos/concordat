schema_version: 1
id: nested-cargo-test-builds
name: Nested cargo test builds
description: >-
  Audits why a repository's tests spend real compilation. Every function in
  test scope that owns a compiler spawn, a trybuild or macrotest suite or a
  `cargo_metadata` query must be declared in `.concordat-nested-builds.toml`
  with the subject the build is the test of and the warm-up that pays for it
  (NC-011). A build whose subject is the test infrastructure itself, a harness,
  an evidence writer, timeout machinery, a preparation stamp or a compile
  counter, is never acceptable, declared or not (NC-012). A declared warm-up
  must resolve to something that runs before the tests (NC-013). The rule
  ships at `warning` severity so the estate can be surveyed before it blocks;
  the `severity` parameter raises it to `error` without a code change.
  Audit-only: this rule declares no mutations.
version: 0.1.0
sensor:
  type: conftest
  input: policy-input/nested-cargo-test-builds
  policy: policy/
  tests:
    - policy/
  data:
    - fixtures/data.json
parameters:
  schema:
    type: object
    additionalProperties: false
    properties:
      severity:
        type: string
        enum: [warning, error]
        description: >-
          The severity of every NC-011, NC-012 and NC-013 finding, and of the
          indeterminate findings that report evidence the reader could not
          establish. An envelope defect is always `error`: it says the rule
          could not run, not that the repository is unsafe.
      harness_paths:
        type: array
        items:
          type: string
          minLength: 1
        description: >-
          Names of the repository's own test-harness code (a module, a crate or
          a function). A function that writes a scratch manifest into a
          temporary directory, builds it, and mentions one of these names is
          the shape of a test of the harness (NC-012). Both halves are
          required: a name alone, or a scratch crate alone, is not evidence.
      exemptions:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [repository, path, rationale, review_trigger]
          properties:
            repository:
              type: string
            path:
              type: string
            rationale:
              type: string
              minLength: 1
            review_trigger:
              type: string
              minLength: 1
        description: >-
          Files the rule does not audit for NC-011 and NC-013, each with its
          repository (`owner/name`, read from the `origin` remote), the exact
          repository-relative file path, the rationale and the review trigger.
          Both text fields must be non-blank. NC-012 cannot be exempted: a
          test of the test infrastructure has no rationale, and evidence the
          reader could not establish stays reported.
  defaults:
    severity: warning
    harness_paths:
      - nested_cargo
      - count_compiling
      - run_bounded
      - run_bounded_with_timeout
    exemptions: []
