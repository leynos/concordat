name: CI
on:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Cache the installer the action installs
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/whitaker-installer
          key: whitaker
      - name: Install Whitaker
        uses: leynos/shared-actions/.github/actions/install-whitaker@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - name: Lint
        run: |
          # Whitaker used to come from: cargo binstall whitaker-installer
          echo "installed by whitaker-installer"
          test -x "${HOME}/.cargo/bin/whitaker-installer"
          make lint
