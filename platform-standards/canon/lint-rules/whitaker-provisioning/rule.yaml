schema_version: 1
id: whitaker-provisioning
name: Whitaker provisioning through install-whitaker
description: >-
  Audits how a checkout provisions the Whitaker lint suite. The only permitted
  route is the shared-actions install-whitaker action, pinned to a certified
  revision: one on shared-actions main that descends from a certification tag
  with the action's runtime content unchanged since it. A certified revision
  carries the estate's install rules: an exact installer version, the lint
  suite never pinned, and --no-source-fallback always passed. The action's own
  contract proves those rules, so this rule does not re-check flags. It refuses
  every other route in workflows, composite actions, Makefiles and scripts: an
  install of whitaker-installer, cargo-dylint or dylint-link by Cargo or
  another action, a download of one, or a direct whitaker-installer invocation;
  and any install-whitaker pin that is not certified (QG-002). A pin whose
  certification cannot be read is indeterminate, not noncompliant. QG-003, a
  pin on the lint suite, is superseded. Whitaker itself is exempt as the
  producer. Audit-only: this rule declares no mutations.
version: 0.2.0
sensor:
  type: conftest
  input: policy-input/whitaker-provisioning
  policy: policy/
  tests:
    - policy/
  data:
    - fixtures/data.json
parameters:
  schema:
    type: object
    additionalProperties: false
    properties:
      certification_tag_prefix:
        type: string
        description: >-
          The prefix of the annotated tags in the action repository that
          certify install-whitaker, followed by the whitaker-installer version
          the tagged commit delivers. A tag is created by a maintainer after
          reviewing the action at that commit, and is the only approval: the
          rule changes nothing when the action repository gains commits. A
          pinned revision is certified when it is on the action repository's
          default branch, equals or descends from a tagged commit, and has the
          same install-whitaker runtime digest as it (every file in the
          directory except tests and Markdown, hashed by mode, blob and path).
      action_branch:
        type: string
        description: >-
          The action repository's default branch. A pinned revision must be on
          it, so a commit that exists only in a fork is not certified.
      producer_repositories:
        type: array
        items:
          type: string
        description: >-
          Repositories that build and publish Whitaker, which the rule does
          not audit.
      action_repository:
        type: string
        description: The repository that owns the install-whitaker action.
      action_directory:
        type: string
        description: The action's directory within that repository.
      exemptions:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [repository, path, reason]
          properties:
            repository:
              type: string
            path:
              type: string
            reason:
              type: string
        description: >-
          Named scripts the rule does not audit, each with its repository and
          the reason. Developer-environment scripts that CI never runs belong
          here, and otherwise only a temporary entry whose reason names the
          change that removes it.
  defaults:
    certification_tag_prefix: "certified/install-whitaker/"
    action_branch: main
    producer_repositories:
      - leynos/whitaker
    action_repository: leynos/shared-actions
    action_directory: .github/actions/install-whitaker
    exemptions:
      - repository: leynos/agent-helper-scripts
        path: get-rust-tooling
        reason: >-
          Developer-environment bootstrap run by hand, never by CI. It pins
          whitaker-installer 0.2.9 and passes --no-source-fallback.
      - repository: leynos/shared-actions
        path: .github/workflows/test-install-tool.yml
        reason: >-
          install-tool self-test; Dylint entries removed by follow-up. The
          workflow's macOS leg asks install-tool for cargo-dylint to prove the
          off-Linux refusal. The follow-up, after shared-actions #488 merges,
          removes the Dylint entries from install-tool's manifest, moves that
          proof onto a synthetic Linux-only entry, and deletes this exemption.
