schema_version: 1
id: rust-dev-build-footprint
name: Rust development build footprint
description: >-
  Forbids incremental compilation and debug information in the default dev
  profile, its package/build overrides and replacing rustflags. Requires
  native Cargo metadata coordination on supported pinned nightly toolchains,
  rejects unsafe raw metadata compiler flags, and leaves stable Cargo exempt.
  Audit-only, with no mutations or host compiler probes.
version: 0.2.1
sensor:
  type: conftest
  input: policy-input/rust-dev-build-footprint
  policy: policy/
  tests:
    - policy/
  data:
    - fixtures/data.json
parameters:
  schema:
    type: object
    additionalProperties: false
    properties: {}
  defaults: {}
