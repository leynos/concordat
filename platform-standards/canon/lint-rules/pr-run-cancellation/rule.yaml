schema_version: 1
id: pr-run-cancellation
name: Pull-request run cancellation
description: >-
  Audits the workflows a repository runs for pull requests. A pull request that
  receives several pushes starts a run per push against the same ref; without
  concurrency cancellation the earlier runs keep the runners busy on a commit
  nobody will merge, and the newest run queues behind them. RC-001 requires a
  cancelling `concurrency` block: at workflow level, or on every job that is
  not disabled with `if: false`. RC-002 requires every cancelling block to name
  the pull request in its group, through `github.event.pull_request.number` or
  `github.head_ref`, so two pull requests do not cancel one another's runs. A
  workflow the rule cannot decode, whose trigger it cannot classify, or whose
  concurrency shape it cannot read is reported as indeterminate rather than
  passing. Exemptions name a repository and an exact workflow path, suppress
  only RC-001 and RC-002, and must carry a rationale and a review trigger. The
  rule ships at `warning` severity so the estate can be surveyed before it
  blocks; the `severity` parameter raises it to `error` without a code change.
  Audit-only: this rule declares no mutations.
version: 0.1.0
sensor:
  type: conftest
  input: policy-input/pr-run-cancellation
  policy: policy/
  tests:
    - policy/
  data:
    - fixtures/data.json
parameters:
  schema:
    type: object
    additionalProperties: false
    properties:
      severity:
        type: string
        enum: [warning, error]
        description: >-
          The severity of every RC-001 and RC-002 finding, and of the
          indeterminate findings that report evidence the reader could not
          establish. An envelope defect is always `error`: it says the rule
          could not run, not that the repository is unsafe. A `warning` finding
          is reported but does not block; promotion to `error` is the intended
          end state once the estate survey is clean.
      exemptions:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [repository, path, rationale, review_trigger]
          properties:
            repository:
              type: string
            path:
              type: string
            rationale:
              type: string
              minLength: 1
            review_trigger:
              type: string
              minLength: 1
        description: >-
          Workflows the rule does not audit, each with its repository
          (`owner/name`, read from the `origin` remote), the exact
          repository-relative workflow path, the rationale and the review
          trigger (the event after which the exemption is revisited). Both text
          fields must be non-blank; the policy ignores an entry that leaves
          either blank, because an exemption nobody must revisit is not a
          record. An exemption suppresses RC-001 and RC-002 only: evidence the
          reader could not establish stays reported.
      repository_exemptions:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [repository, rationale, review_trigger]
          properties:
            repository:
              type: string
            rationale:
              type: string
              minLength: 1
            review_trigger:
              type: string
              minLength: 1
        description: >-
          Repositories the rule does not audit for run cancellation, each with
          the repository (`owner/name`), the rationale and the review trigger.
          Use this only where a repository's pull-request runs must not be
          cancelled at all, such as a CI lane that deliberately serialises
          every push. Prefer an exact-path `exemptions` entry where one
          workflow is the exception. Both text fields must be non-blank, and an
          entry suppresses RC-001 and RC-002 only.
  defaults:
    severity: warning
    exemptions: []
    repository_exemptions: []