version: 2
updates:
  # Enable version updates for GitHub Actions, in the workflows and in the
  # composite actions under .github/actions, which pin their own `uses:`.
  - package-ecosystem: "github-actions"
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    directories:
      - "/"
      - "/.github/actions/*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  # Enable version updates for Python (uv-managed pyproject.toml)
  - package-ecosystem: "uv"
    directory: "/"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # Enable version updates for Go modules
  - package-ecosystem: "gomod"
    directory: "/platform-standards/tofu/terratest"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
