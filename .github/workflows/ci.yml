---
name: CI

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    # The job checks out, installs pinned tools, and runs the gates. Nothing
    # it does writes to the repository, so the token is read-only rather than
    # whatever the repository or organisation default happens to be.
    permissions:
      contents: read
    env:
      TOFU_VERSION: "1.10.7"
      # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the first
      # release with `--check` and `--git`.
      MDTABLEFIX_VERSION: "0.6.0"
      # makeutil v0.1.0's x86_64 musl release asset and its SHA-256 digest.
      # Bump the version and the digest together.
      MAKEUTIL_VERSION: "0.1.0"
      MAKEUTIL_ASSET: "makeutil-x86_64-unknown-linux-musl"
      MAKEUTIL_SHA256: "99dd28a138dbe07e88e4dc5dd3954e6b29b46cc959635311d326cb537253115d"
      MAKEUTIL_RELEASES: "https://github.com/leynos/makeutil/releases/download"
    steps:
      - name: Check out repository
        # v4
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Set up Go
        # v5
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.22'

      - name: Set up Python
        # v5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Install uv
        # v5
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990

      - name: Install CLI tools
        run: |
          for tool in mbake ruff; do uv tool install ${tool}; done
          go install github.com/open-policy-agent/conftest@v0.52.0

      - name: Install mdtablefix
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          version: ${{ env.MDTABLEFIX_VERSION }}

      - name: Install Makefile parser
        # The released static binary, verified against the digest pinned
        # above rather than the release's own checksum file, so a replaced
        # asset fails here instead of running.
        run: |
          set -euo pipefail
          download="${RUNNER_TEMP}/${MAKEUTIL_ASSET}"
          bin_dir="${RUNNER_TEMP}/makeutil-bin"
          curl --fail --silent --show-error --location --proto '=https' \
            --tlsv1.2 --output "${download}" \
            "${MAKEUTIL_RELEASES}/v${MAKEUTIL_VERSION}/${MAKEUTIL_ASSET}"
          printf '%s  %s\n' "${MAKEUTIL_SHA256}" "${download}" \
            | sha256sum --check --strict
          install -D -m 0755 "${download}" "${bin_dir}/makeutil"
          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Install OpenTofu
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git unzip
          tofu_zip="tofu_${TOFU_VERSION}_linux_amd64.zip"
          tofu_url="https://github.com/opentofu/opentofu/releases/download"
          tofu_url="${tofu_url}/v${TOFU_VERSION}/${tofu_zip}"
          if curl -fsSLO "${tofu_url}"; then
            unzip -q "${tofu_zip}" -d /tmp
            sudo mv /tmp/tofu /usr/local/bin/tofu
            sudo chmod +x /usr/local/bin/tofu
            rm "${tofu_zip}"
          else
            tofu_repo="https://github.com/opentofu/opentofu.git"
            git clone --depth 1 --branch "v${TOFU_VERSION}" \
              "${tofu_repo}" /tmp/opentofu
            cd /tmp/opentofu
            go build -o /tmp/tofu-bin ./cmd/tofu
            sudo mv /tmp/tofu-bin /usr/local/bin/tofu
            sudo chmod +x /usr/local/bin/tofu
          fi

      - name: Run Terratest suite
        working-directory: platform-standards/tofu/terratest
        env:
          TERRAFORM_BINARY: tofu
        run: go test

      - name: Run policy tests
        run: |
          conftest test \
            --policy platform-standards/tofu/policies \
            platform-standards/tofu/policies/examples/*.json

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make
        # markdownlint`. Spelling stays in `make lint` below.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Run lint and dead-code detection
        run: make lint

      - name: Run typechecker
        run: make typecheck

      - name: Generate coverage
        # Coverage is generated only on pull requests here; main-branch
        # coverage (which CodeScene requires for its "upload" mode) is
        # generated and uploaded by coverage-main.yml on push, so this
        # step is skipped there to avoid generating it twice.
        if: github.event_name == 'pull_request'
        # `uv venv` builds the coverage environment from the newest
        # interpreter uv can find, and the tool installs above leave a
        # managed 3.14 behind. Without this the lane measured on 3.14 while
        # the publisher measured on 3.13, and the ratchet compared the two.
        env:
          UV_PYTHON: '3.13'
        uses: leynos/shared-actions/.github/actions/generate-coverage@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          output-path: coverage.xml
          format: cobertura
          # The v1 cache predates the current serial coverage measurement.
          # Rotate only the Python baseline path to rebase the ratchet on
          # the complete current suite.
          baseline-python-file: .coverage-baseline.python-v2
          pytest-workers: ''
          with-ratchet: 'true'
          # The action defaults this to "true", so a lane that omits it
          # publishes the report. Only the main publisher publishes here.
          publish-artefact: 'false'
