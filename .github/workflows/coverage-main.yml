---
name: Coverage (main)

# CodeScene accepts `cs-coverage upload` only for analysed branches, so
# main-branch coverage is uploaded here on push; pull requests only
# generate coverage in ci.yml (no upload) until the project's coverage
# gate is confirmed. This workflow also advances the coverage ratchet
# baseline: caches saved on main are readable by every pull-request run,
# so the baseline written here is the one PR ratchet checks compare
# against.

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    env:
      MAKEUTIL_REVISION: "29fc5a1634ffbaa18a773eed9dff1b2838a45d9c"
      MAKEUTIL_TOOLCHAIN: "nightly-2026-05-28"
    steps:
      - name: Check out repository
        # v4
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        # v5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Install uv
        # v5
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Install Makefile parser
        run: |
          rustup toolchain install "${MAKEUTIL_TOOLCHAIN}" --profile minimal
          RUSTFLAGS="-Zpolonius=next" cargo +"${MAKEUTIL_TOOLCHAIN}" install \
            --git https://github.com/leynos/makeutil \
            --rev "${MAKEUTIL_REVISION}" \
            --locked \
            --force \
            makeutil

      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@824724a791a7f6dfef79bf95e11ea744b6eb4de4
        with:
          output-path: coverage.xml
          format: cobertura
          # Keep this path aligned with pull-request coverage. The v1 cache
          # predates the current serial coverage measurement.
          baseline-python-file: .coverage-baseline.python-v2
          pytest-workers: ''
          with-ratchet: 'true'

      - name: Upload coverage data to CodeScene
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: env.CS_ACCESS_TOKEN != ''
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@824724a791a7f6dfef79bf95e11ea744b6eb4de4
        with:
          format: cobertura
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}
