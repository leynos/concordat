---
name: Coverage (main)

# CodeScene accepts `cs-coverage upload` only for analysed branches, so
# main-branch coverage is uploaded here on push; pull requests only
# generate coverage in ci.yml (no upload) until the project's coverage
# gate is confirmed. This workflow also advances the coverage ratchet
# baseline: caches saved on main are readable by every pull-request run,
# so the baseline written here is the one PR ratchet checks compare
# against.

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]

# Two pushes to `main` in quick succession would otherwise race to write the
# ratchet baseline that every pull request is then measured against, and the
# loser's partial write is the one a pull request might restore. Runs are not
# cancelled: a cancelled publisher abandons both its upload and its baseline
# write. For triggered runs (a push, or a dispatch), a running publisher
# finishes and a newer one waits behind it, replacing any older pending run,
# so the newest triggered run's baseline wins. A manual "Re-run jobs" on an
# older run is an operator action: it keeps that run's commit, so it
# republishes that commit's coverage and baseline until the next push
# supersedes it.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    env:
      MAKEUTIL_REVISION: "29fc5a1634ffbaa18a773eed9dff1b2838a45d9c"
      MAKEUTIL_TOOLCHAIN: "nightly-2026-05-28"
    steps:
      - name: Check out repository
        # v4
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Go
        # v5
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.22'

      - name: Set up Python
        # v5
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      - name: Install uv
        # v5
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990

      - name: Install CLI tools
        run: |
          go install github.com/open-policy-agent/conftest@v0.52.0

      - name: Install Makefile parser
        run: |
          rustup toolchain install "${MAKEUTIL_TOOLCHAIN}" --profile minimal
          RUSTFLAGS="-Zpolonius=next" cargo +"${MAKEUTIL_TOOLCHAIN}" install \
            --git https://github.com/leynos/makeutil \
            --rev "${MAKEUTIL_REVISION}" \
            --locked \
            --force \
            makeutil

      - name: Generate coverage
        # Pin the interpreter `uv venv` resolves to the one set up above, as
        # the pull-request lane does, so the baseline written here and the
        # coverage compared against it are measured by one interpreter.
        env:
          UV_PYTHON: '3.13'
        uses: leynos/shared-actions/.github/actions/generate-coverage@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          output-path: coverage.xml
          format: cobertura
          # Keep this path aligned with pull-request coverage. The v1 cache
          # predates the current serial coverage measurement.
          baseline-python-file: .coverage-baseline.python-v2
          pytest-workers: ''
          with-ratchet: 'true'

      - name: Upload coverage data to CodeScene
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        # Guarded on the ref as well as the credential. The push filter above
        # says nothing about a `workflow_dispatch`, which selects its own ref,
        # so without this a dispatch from a feature branch would publish that
        # branch's coverage as the trunk's.
        if: env.CS_ACCESS_TOKEN != '' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          format: cobertura
          mode: upload
          access-token: ${{ env.CS_ACCESS_TOKEN }}
