[project]
name = "concordat"
version = "0.1.0"
description = "concordat package"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Payton McIntosh", email = "pmcintosh@df12.net" },
]
dependencies = [
    "boto3>=1.43.68",
    "cyclopts",
    "github3.py",
    "pygit2",
    "requests",
    "ruamel.yaml",
    "tofupy>=1.1.2,<2.0",
]

[project.scripts]
concordat = "concordat.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "pytest-bdd",
    "pytest-asyncio",
    "pytest-mock",
    "ruff",
    "pyright",
    "pytest-timeout",
    "betamax",
    "hypothesis",
    "textual>=8.2.8,<9.0",
    "df12-python-lints @ git+https://github.com/leynos/df12-python-lints.git@9c835f35b0f1690597ade799c9c6a30bc5922959",
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["concordat"]

[tool.ruff]
line-length = 88
preview = true
target-version = "py313"

[tool.ruff.lint]
select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "A",        # detect shadowed builtins
    "BLE",      # disallow catch-all exceptions
    "S",        # disallow things like "exec"; also restricts "assert" but I just NOQA it when I really need it
    "DTZ",      # require strict timezone manipulation with datetime
    "FBT",      # detect boolean traps
    "N",        # enforce naming conventions, e.g. ClassName vs function_name
    "FURB",
    "B",
    "RUF",
    "LOG",
    "Q",
    "PT",
    "RSE",
    "PERF",
    "TRY",
    "D",
    "DOC",
    "ASYNC",
    "ANN",
]
ignore = [
    "D203",  # Conflicts with D211; keep class summaries adjacent to the class.
    "D213",  # Conflicts with D212; keep summaries on the first docstring line.
    # S404 only reports importing subprocess. Every process boundary remains
    # subject to S603/S607, whose call-site checks establish the real security
    # invariant: fixed argv and an intentional executable-resolution policy.
    "S404",
    # These stateful test doubles model a command protocol, not passive data;
    # converting them to dataclasses would obscure the behaviour under test.
    "B903",
]
# `assert` is the point of a test, and of the assertion helpers that test
# modules share; the support pattern covers helper modules whose names cannot
# start with `test_` without pytest collecting them.
per-file-ignores = {"**/test_*.py" = ["S101"], "tests/**/*_support.py" = ["S101"]}

[tool.ruff.lint.flake8-import-conventions]
# Declare the banned `from` imports.
banned-from = [
    "typing",
    "datetime",
    "collections.abc",
    "dataclasses",
    "enum",
    "unittest.mock",
    "msgspec",
]

[tool.ruff.lint.flake8-import-conventions.aliases]
# Declare the default aliases.
altair = "alt"
"matplotlib.pyplot" = "plt"
numpy = "np"
pandas = "pd"
seaborn = "sns"
scipy = "sp"
"collections.abc" = "cabc"
datetime = "dt"
"unittest.mock" = "mock"
"msgspec.json" = "msjson"
typing = "typ"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true

[tool.pylint.main]
recursive = true
max-module-lines = 800

[tool.pylint.design]
# CLI commands, BDD steps, and GitHub callbacks carry public parameter
# contracts. Ten preserves those boundaries while flagging unwieldy internals.
max-args = 10
max-locals = 20
max-statements = 70
max-positional-arguments = 10
# The policy dispatcher deliberately exposes the complete audit matrix in one
# place; splitting its branches would obscure that relationship.
max-branches = 15

[tool.pylint."messages control"]
disable = [
    "all",
    # Managed PyPy can lag the project's supported CPython syntax. Keep the
    # baseline pass useful on files it can parse.
    "syntax-error",
]
enable = [
    # Logging format safety.
    "logging-format-interpolation",
    "logging-format-truncated",
    "logging-fstring-interpolation",
    "logging-not-lazy",
    "logging-too-few-args",
    "logging-too-many-args",
    "logging-unsupported-format",

    # Pattern-matching correctness and readability.
    "bare-name-capture-pattern",
    "invalid-match-args-definition",
    "match-class-bind-self",
    "match-class-positional-attributes",
    "multiple-class-sub-patterns",
    "too-many-positional-sub-patterns",

    # Control-flow simplification.
    "chained-comparison",
    "condition-evals-to-constant",
    "consider-merging-isinstance",
    "consider-swap-variables",
    "consider-using-in",
    "consider-using-max-builtin",
    "consider-using-min-builtin",
    "consider-using-sys-exit",
    "consider-using-ternary",
    "inconsistent-return-statements",
    "no-else-break",
    "no-else-continue",
    "no-else-raise",
    "no-else-return",
    "redefined-argument-from-local",
    "simplifiable-condition",
    "simplifiable-if-expression",
    "simplifiable-if-statement",
    "simplify-boolean-expression",
    "stop-iteration-return",
    "super-with-arguments",
    "trailing-comma-tuple",
    "unnecessary-negation",
    "useless-return",

    # Collection and iterator idioms.
    "consider-iterating-dictionary",
    "consider-using-dict-comprehension",
    "consider-using-dict-items",
    "consider-using-enumerate",
    "consider-using-f-string",
    "consider-using-generator",
    "consider-using-get",
    "consider-using-join",
    "consider-using-set-comprehension",
    "unnecessary-comprehension",
    "unnecessary-dict-index-lookup",
    "unnecessary-list-index-lookup",
    "use-a-generator",
    "use-dict-literal",
    "use-implicit-booleaness-not-comparison",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-len",
    "use-list-literal",
    "use-maxsplit-arg",
    "use-sequence-for-iteration",
    "use-yield-from",

    # Runtime APIs, resources, and compatibility hazards.
    "bad-open-mode",
    "bad-thread-instantiation",
    "boolean-datetime",
    "consider-using-with",
    "deprecated-argument",
    "deprecated-attribute",
    "deprecated-class",
    "deprecated-decorator",
    "deprecated-method",
    "forgotten-debug-statement",
    "invalid-envvar-default",
    "invalid-envvar-value",
    "method-cache-max-size-none",
    "redundant-unittest-assert",
    "shallow-copy-environ",
    "singledispatch-method",
    "singledispatchmethod-function",
    "subprocess-popen-preexec-fn",
    "subprocess-run-check",
    "unnecessary-dunder-call",
    "unnecessary-ellipsis",
    "unspecified-encoding",

    # Source layout and text hygiene.
    "missing-final-newline",
    "mixed-line-endings",
    "superfluous-parens",
    "trailing-newlines",
    "trailing-whitespace",
    "unexpected-line-ending-format",

    # Mutation during iteration.
    "modified-iterating-dict",
    "modified-iterating-list",
    "modified-iterating-set",

    # Structural complexity limits.
    "too-many-arguments",
    "too-many-boolean-expressions",
    "too-many-branches",
    "too-many-lines",
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-statements",
]

[tool.pytest.ini_options]
# Ensure asyncio fixtures create a new event loop for each test
asyncio_default_fixture_loop_scope = "function"
# Tests automatically killed after seconds elapsed
timeout = 30
# Put the repository root on sys.path so `scripts/tests` can import the
# `scripts` package without a conftest-time sys.path mutation.
pythonpath = ["."]
testpaths = ["scripts/tests", "tests"]
markers = [
    "integration: marks tests that rely on act or external tooling",
]

[tool.uv]
package = true


[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

# Ship the canon lint-rule policy tree inside the installed package so
# `concordat artefact rule run` works from a wheel, not only a source checkout.
# `concordat.canon` maps to the out-of-tree `platform-standards/canon` source so
# its `lint-rules/**` data lands under `concordat/canon/lint-rules` in the wheel;
# the runner resolves this via `importlib.resources`, with a source fallback.
[tool.setuptools]
# List every shipped package explicitly. `concordat.canon` is the out-of-tree
# policy-data package (mapped and populated below); it must be named here, which
# rules out `packages.find`, so the in-tree subpackages are listed too.
packages = [
    "concordat",
    "concordat.auditor",
    "concordat.persistence",
    "concordat.rules",
    "concordat.canon",
]

[tool.setuptools.package-dir]
"concordat.canon" = "platform-standards/canon"

[tool.setuptools.package-data]
"concordat.canon" = ["lint-rules/**/*"]
